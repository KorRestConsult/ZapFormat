# ZAPFORMAT_LIVE_V1 - Dedicated domains; the legacy HTTPS host is retained.
server {
    listen 80;
    listen [::]:80;
    server_name api.zapformat.ru;
    return 301 https://api.zapformat.ru$request_uri;
}
server {
    listen 443 ssl;
    # TLS 1.3 negotiation intermittently stalls for external clients; use TLS 1.2 while investigated.
    ssl_protocols TLSv1.2;
    server_name api.zapformat.ru;
    ssl_certificate /etc/letsencrypt/live/zapformat-domains/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zapformat-domains/privkey.pem;
    client_max_body_size 2m;
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { return 404; }
}
server {
    listen 80;
    listen [::]:80;
    server_name admin.zapformat.ru;
    return 301 https://admin.zapformat.ru$request_uri;
}
server {
    listen 443 ssl;
    # TLS 1.3 negotiation intermittently stalls for external clients; use TLS 1.2 while investigated.
    ssl_protocols TLSv1.2;
    server_name admin.zapformat.ru;
    ssl_certificate /etc/letsencrypt/live/zapformat-domains/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zapformat-domains/privkey.pem;
    root /opt/zapformat/admin;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    location / { try_files $uri $uri/ /index.html; }
    location ~ /\. { deny all; }
}
