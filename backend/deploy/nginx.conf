# ZapFormat same-origin virtual host template.
# Replace zapformat.example.com only after DNS is ready.
# This file is intentionally not installed automatically.

server {
    listen 80;
    listen [::]:80;
    server_name zapformat.example.com;

    root /opt/zapformat;
    index index.html;
    client_max_body_size 2m;

    # Backend stays private on 127.0.0.1:3000.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # One-file frontend. Query-string navigation keeps working.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files /index.html =404;
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(?:env|sql|sh|service|md)$ {
        deny all;
    }
}
