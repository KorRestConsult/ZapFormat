# ZapFormat same-origin virtual host template.
# Replace zapformat.example.com only after DNS is ready.
# This file is intentionally not installed automatically.

server {
    listen 80;
    listen [::]:80;
    server_name zapformat.example.com;

    root /var/www/zapformat;
    index index.html;
    client_max_body_size 2m;

    # Compress the single-file storefront and JSON responses.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Backend stays private on 127.0.0.1:3000.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # One-file frontend copied to a dedicated public directory.
    # The git checkout under /opt/zapformat is never a web root.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; form-action 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" always;
        try_files /index.html =404;
    }

    location ^~ /backend/ {
        return 404;
    }

    location ^~ /.github/ {
        return 404;
    }

    location ^~ /test/ {
        return 404;
    }

    location ~ /\. {
        return 404;
    }
}
