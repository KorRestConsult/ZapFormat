# Before DNS/TLS: keep all API and login traffic on existing HTTPS hosts.
server {
    listen 80;
    listen [::]:80;
    server_name api.zapformat.ru;
    location / {
        return 308 https://api.168.113.211.246.sslip.io$request_uri;
    }
}
server {
    listen 80;
    listen [::]:80;
    server_name admin.zapformat.ru;
    location / {
        return 302 https://korrestconsult.github.io/ZapFormat/admin/;
    }
}
