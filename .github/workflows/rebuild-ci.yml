name: Rebuild branch checks

on:
  push:
    branches:
      - rebuild-from-zero-2026-09-26

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zapformat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zapformat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Backend dependencies
        working-directory: backend
        run: npm install --ignore-scripts --package-lock=false
      - name: Backend syntax
        working-directory: backend
        run: node --check src/server.js && node --check src/partgrade.js && node --check src/pricing.js && node --check src/ai.js
      - name: Backend unit tests
        working-directory: backend
        run: npm test
      - name: PostgreSQL migrations and database smoke
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zapformat_test
        run: node test/db-smoke.js
      - name: Deploy script syntax
        shell: bash
        run: bash -n backend/deploy/*.sh
      - name: Frontend integrity and syntax
        shell: bash
        run: |
          test -f index.html
          test ! -e app.js
          test ! -e styles.css
          test ! -e config.js
          ! grep -Eqi 'demoOrders|datasets[[:space:]]*=|purchase[[:space:]]*:|PartGrade|ABCP' index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path("index.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script>(.*?)</script>",html,re.S)
          if len(scripts) != 1:
              raise SystemExit(f"expected one inline script, found {len(scripts)}")
          Path("/tmp/zapformat-inline.js").write_text(scripts[0],encoding="utf-8")
          PY
          node --check /tmp/zapformat-inline.js

  responsive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install browser smoke dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Serve rebuild frontend
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/zf-http.log 2>&1 &
          echo $! >/tmp/zf-http.pid
      - name: Desktop iPad iPhone smoke
        run: node test/responsive-smoke.mjs
