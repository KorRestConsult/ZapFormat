name: Bootstrap OpenAI key once

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  install:
    runs-on: ubuntu-latest
    env:
      ENCRYPTED_OPENAI_KEY: G4-16OuByn_Xewe9nPd4sskgNFCl9MO1soPH7G1F6O9UvTczWy62XuqsZhOz_7ULr-AHkH0FBjdDuC9y291v40J2TRhO2gLyWvIns3LTvM42aq9dI1UbXkTXDjtOeXUTiASkVh6-96Dhwm7R6_-ZaGgGHy07vfE4CnfSTUlUctd6YLMqsgxR7NEny_E4Kz0Tg9vzrlw0HmCZ93W5xNTagcDuopRl9HD1bC_SN6Kpg6Og7Y1z0G0V1S5HCIxW8FYjtOOstzd9XrKzumt4K3cCpziVhXE_eqxR3DWZFz9eJVgIVyc35r6U7qHMRi2Ga9JqdMLR0zzB5ekz4qdYD2qT8q6Qv-uwWylRxffQOJdqv316iGsOYLSuJbq5Wy4OwdRQKetmGT8USswd_xEojELWGpE8Q4yBOvRFv5krNZbTNl6RDKrNq6_o5MUSWkMWe7lE8IcJRkKt66iRhe8R3vMX4BBAD8SuowYOxIc0CiB-SydNYt4QEW3Wlobj1Ak7xOdKjgZ0Njffr3s5mT1XNFKQx3O_wnQxUNuMWEEbpyK7KJC3mw5lfABWhB8s7J8g6ZzwhjYRfgqolAipjLfhM9c8_G8y_EyhKqez6YF6PEfmQ-pWNaGLbWQdEMapSQFSku1A_i0bT-k_OEYxmM35DErAOUOvXMDQuo1gKIfqa5c45yQ
    steps:
      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -Eeuo pipefail
          JSON="$(curl -fsSL             -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=zapformat-deploy")"
          TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"${JSON}")"
          echo "::add-mask:${TOKEN}"
          echo "token=${TOKEN}" >> "${GITHUB_OUTPUT}"

      - name: Install encrypted OpenAI key
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -Eeuo pipefail
          PAYLOAD="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
              "sha": os.environ["GITHUB_SHA"],
              "encrypted_api_key": {
                  "version": 1,
                  "ciphertext": os.environ["ENCRYPTED_OPENAI_KEY"],
              },
          }))
          PY
          )"
          curl -fsS -X POST             -H "Authorization: Bearer ${OIDC_TOKEN}"             -H "Content-Type: application/json"             --data-binary "${PAYLOAD}"             https://api.201.51.28.68.sslip.io/api/internal/openai-key

      - name: Verify AI is configured
        shell: bash
        run: |
          set -Eeuo pipefail
          JSON="$(curl -fsS https://api.201.51.28.68.sslip.io/api/search/health)"
          echo "${JSON}"
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True and d.get("ai_configured") is True' <<<"${JSON}"
