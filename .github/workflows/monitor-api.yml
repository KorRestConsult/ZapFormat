name: Monitor ZapFormat Public API

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-health:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check public HTTPS and database health (three attempts)
        shell: bash
        run: |
          set -u
          for attempt in 1 2 3; do
            echo "API HTTPS check attempt ${attempt}/3"
            BODY="$(curl --fail --silent --show-error --connect-timeout 6 --max-time 15 https://api.168.113.211.246.sslip.io/api/health)" && \
            python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True and d.get("db") is True, "API or DB unhealthy"; print("API and database healthy")' <<< "$BODY" && exit 0
            if [ "${attempt}" -lt 3 ]; then sleep 8; fi
          done
          echo "::error::ZapFormat public HTTPS/API/DB health check failed 3 attempts"
          exit 1
