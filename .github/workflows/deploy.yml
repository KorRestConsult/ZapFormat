name: Deploy ZapFormat

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: zapformat-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate application
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check app.js
          node --check backend/src/server.js
          node --check backend/src/partgrade.js
          node --check backend/src/ai-search.js
          node --check backend/src/vehicle-catalog.js
          node --check backend/src/secret-bootstrap.js
          cd backend
          npm test

      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -Eeuo pipefail
          JSON="$(curl -fsSL             -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=zapformat-deploy")"
          TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"${JSON}")"
          echo "::add-mask:${TOKEN}"
          echo "token=${TOKEN}" >> "${GITHUB_OUTPUT}"

      - name: Queue production deploy
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -Eeuo pipefail
          PAYLOAD="$(printf '{"sha":"%s"}' "${GITHUB_SHA}")"
          curl -fsS -X POST             -H "Authorization: Bearer ${OIDC_TOKEN}"             -H "Content-Type: application/json"             --data-binary "${PAYLOAD}"             https://api.201.51.28.68.sslip.io/api/internal/deploy

      - name: Wait for deploy
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 90); do
            JSON="$(curl -fsS https://api.201.51.28.68.sslip.io/api/deploy/status || true)"
            if [[ -n "${JSON}" ]]; then
              STATUS="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))' <<<"${JSON}" 2>/dev/null || true)"
              DEPLOYED="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("deployed_sha") or "")' <<<"${JSON}" 2>/dev/null || true)"
              REQUESTED="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("requested_sha") or "")' <<<"${JSON}" 2>/dev/null || true)"
              MESSAGE="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("message") or "")' <<<"${JSON}" 2>/dev/null || true)"
              echo "status=${STATUS} requested=${REQUESTED} deployed=${DEPLOYED} message=${MESSAGE}"
              if [[ "${STATUS}" == "success" && "${DEPLOYED}" == "${GITHUB_SHA}" ]]; then
                exit 0
              fi
              if [[ "${STATUS}" == "failed" && "${REQUESTED}" == "${GITHUB_SHA}" ]]; then
                exit 1
              fi
            fi
            sleep 2
          done
          echo "Timed out waiting for production deploy"
          exit 1

      - name: Install Timeweb AI Gateway token
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          TIMEWEB_AI_TOKEN: ${{ secrets.TIMEWEB_AI_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${TIMEWEB_AI_TOKEN}" ]]; then
            echo "TIMEWEB_AI_TOKEN is not configured; skipping"
            exit 0
          fi
          echo "::add-mask:${TIMEWEB_AI_TOKEN}"
          python3 - <<'PY' > /tmp/timeweb-ai.json
          import json, os
          print(json.dumps({
              "sha": os.environ["GITHUB_SHA"],
              "timeweb_ai_token": os.environ["TIMEWEB_AI_TOKEN"],
              "timeweb_ai_model": "openai/gpt-5.6-luna"
          }))
          PY
          curl -fsS -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/timeweb-ai.json \
            https://api.201.51.28.68.sslip.io/api/internal/timeweb-ai-token >/dev/null
          rm -f /tmp/timeweb-ai.json

      - name: Verify search services
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -Eeuo pipefail
          echo "AI search:"
          curl -fsS https://api.201.51.28.68.sslip.io/api/search/health
          echo
          echo "Vehicle catalog:"
          curl -fsS https://api.201.51.28.68.sslip.io/api/catalog/vehicle-catalog/status
          echo
          echo "Supplier integration:"
          curl -fsS https://api.201.51.28.68.sslip.io/api/integration/status
          echo
          echo "AI web-fitment smoke:"
          PAYLOAD="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
              "sha": os.environ["GITHUB_SHA"],
              "query": "передние тормозные колодки Ford Focus II 2006 1.8 бензин"
          }, ensure_ascii=False))
          PY
          )"
          JSON="$(curl -fsS -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary "${PAYLOAD}" \
            https://api.201.51.28.68.sslip.io/api/internal/search-smoke)"
          echo "${JSON}"
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True; assert d.get("ai_configured") is True; assert d.get("research_mode") in {"web","web_failed","model"}, d' <<<"${JSON}"
