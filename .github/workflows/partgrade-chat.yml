name: PartGrade Chat Bridge

on:
  push:
    branches:
      - partgrade-chat
    paths:
      - partgrade-chat/request.json

permissions:
  contents: read
  id-token: write

concurrency:
  group: partgrade-chat
  cancel-in-progress: false

jobs:
  call-partgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout request
        uses: actions/checkout@v4

      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -Eeuo pipefail
          JSON="$(curl -fsSL             -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=zapformat-partgrade-chat")"
          TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"${JSON}")"
          echo "::add-mask:${TOKEN}"
          echo "token=${TOKEN}" >> "${GITHUB_OUTPUT}"

      - name: Call PartGrade through ZapFormat
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY' > /tmp/partgrade-payload.json
          import json, os
          with open("partgrade-chat/request.json", "r", encoding="utf-8") as f:
              req = json.load(f)
          payload = {
              "sha": os.environ["GITHUB_SHA"],
              "tool": req["tool"],
              "arguments": req.get("arguments", {}),
              "approved": bool(req.get("approved", False)),
          }
          print(json.dumps(payload, ensure_ascii=False))
          PY

          HTTP_CODE="$(curl -sS -o /tmp/partgrade-result.json -w '%{http_code}'             -X POST             -H "Authorization: Bearer ${OIDC_TOKEN}"             -H "Content-Type: application/json"             --data-binary @/tmp/partgrade-payload.json             https://api.201.51.28.68.sslip.io/api/internal/partgrade-chat)"

          echo "PARTGRADE_HTTP_STATUS=${HTTP_CODE}"
          echo "PARTGRADE_RESULT_BEGIN"
          cat /tmp/partgrade-result.json
          echo
          echo "PARTGRADE_RESULT_END"

          if [[ "${HTTP_CODE}" -lt 200 || "${HTTP_CODE}" -ge 300 ]]; then
            exit 1
          fi
