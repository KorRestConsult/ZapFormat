name: Check ZapFormat Frontend

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'config.js'
      - 'admin/**'
      - 'tests/**'
      - '.github/workflows/frontend-checks.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'config.js'
      - 'admin/**'
      - 'tests/**'
      - '.github/workflows/frontend-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        run: |
          node --check app.js
          node --check config.js
          node --check admin/admin.js
          node --check backend/src/server.js
          node --check backend/src/garage-photo-routes.js

      - name: Validate backend before production release
        working-directory: backend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test

      - name: Validate interface, routes and checkout guards
        run: node --test tests/ui-contract.test.mjs tests/admin-page.test.mjs tests/domain-migration.test.mjs tests/registration-types.test.mjs tests/garage-clean.test.mjs tests/garage-photo-ui.test.mjs backend/test/garage-photo-routes.test.js
