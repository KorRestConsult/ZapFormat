name: Telegram Card Smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -Eeuo pipefail
          JSON="$(curl -fsSL -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=zapformat-deploy")"
          TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"${JSON}")"
          echo "::add-mask:${TOKEN}"
          echo "token=${TOKEN}" >> "${GITHUB_OUTPUT}"

      - name: Send latest TEST order card
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -Eeuo pipefail
          PAYLOAD="$(printf '{"sha":"%s"}' "${GITHUB_SHA}")"
          JSON="$(curl -fsS -X POST             -H "Authorization: Bearer ${OIDC_TOKEN}"             -H "Content-Type: application/json"             --data-binary "${PAYLOAD}"             https://api.168.113.211.246.sslip.io/api/internal/telegram-card-smoke)"
          echo "${JSON}"
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True; assert d.get("telegram",{}).get("sent") is True' <<<"${JSON}"
