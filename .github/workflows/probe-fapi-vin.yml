name: Probe FAPI VIN

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-fapi-vin.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe usage and VIN
        shell: bash
        env:
          FAPI_API_KEY: ${{ secrets.FAPI_API_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "${FAPI_API_KEY}"
          echo "::add-mask:${FAPI_API_KEY}"

          echo "USAGE:"
          curl -sS -w '\nHTTP_STATUS=%{http_code}\n' \
            -H "Authorization: Bearer ${FAPI_API_KEY}" \
            -H "Accept: application/json" \
            https://fapi.iisis.ru/fapi/v2/usage > usage.txt
          cat usage.txt

          echo "VIN:"
          curl -sS -w '\nHTTP_STATUS=%{http_code}\n' \
            -H "Authorization: Bearer ${FAPI_API_KEY}" \
            -H "Accept: application/json" \
            "https://fapi.iisis.ru/fapi/v2/vin?vin=WBAWY31000L527390" > vin.txt
          echo "VIN RAW:"
          cat vin.txt
          python3 - <<'PY'
          import json, pathlib
          raw=pathlib.Path("vin.txt").read_text()
          body, _, status = raw.rpartition("\nHTTP_STATUS=")
          print("HTTP_STATUS="+status.strip())
          try:
              d=json.loads(body)
          except Exception:
              print(body[:2000])
              raise SystemExit
          safe = {
              "confidence": d.get("confidence"),
              "brand_name": d.get("brand_name"),
              "manufacturer": d.get("manufacturer"),
              "model_name": d.get("model_name"),
              "modification_name": d.get("modification_name"),
              "model_year": d.get("model_year"),
              "engine_code": d.get("engine_code"),
              "fuel_type": d.get("fuel_type"),
              "power_hp": d.get("power_hp"),
              "dt_type_id": d.get("dt_type_id"),
              "status": d.get("status"),
              "error": d.get("error"),
              "message": d.get("message"),
          }
          print(json.dumps(safe, ensure_ascii=False))
          PY

      - name: Probe BMW F25 modifications
        shell: bash
        env:
          FAPI_API_KEY: ${{ secrets.FAPI_API_KEY }}
        run: |
          set -Eeuo pipefail
          echo "::add-mask:${FAPI_API_KEY}"
          curl -sS \
            -H "Authorization: Bearer ${FAPI_API_KEY}" \
            -H "Accept: application/json" \
            "https://fapi.iisis.ru/fapi/v2/catalogList/dt/modificationList?mi=8763" > modifications.json
          echo "MODIFICATIONS:"
          python3 - <<'PY'
          import json
          rows=json.load(open("modifications.json",encoding="utf-8"))
          if not isinstance(rows,list):
              print(json.dumps(rows,ensure_ascii=False)[:3000])
              raise SystemExit
          hits=[]
          for r in rows:
              code=str(r.get("engineCode") or "").upper()
              power=str(r.get("power") or "")
              desc=str(r.get("fd") or r.get("d") or "")
              if "N47N" in code or power=="135" or "135" in power:
                  hits.append({
                      "dbi":r.get("dbi"),
                      "d":r.get("d"),
                      "fd":r.get("fd"),
                      "engineType":r.get("engineType"),
                      "engineCode":r.get("engineCode"),
                      "power":r.get("power"),
                      "capacity":r.get("capacity"),
                      "driveType":r.get("driveType"),
                      "bodyType":r.get("bodyType"),
                      "cb":r.get("cb"),
                      "ce":r.get("ce")
                  })
          print(json.dumps({"count":len(rows),"matches":hits},ensure_ascii=False))
          PY

      - name: Probe BMW F25 catalog tree
        shell: bash
        env:
          FAPI_API_KEY: ${{ secrets.FAPI_API_KEY }}
        run: |
          set -Eeuo pipefail
          echo "::add-mask:${FAPI_API_KEY}"
          curl -sS \
            -H "Authorization: Bearer ${FAPI_API_KEY}" \
            -H "Accept: application/json" \
            "https://fapi.iisis.ru/fapi/v2/catalogList/dt/treeList?mi=33778" > tree.json
          echo "TREE ROOTS:"
          python3 - <<'PY'
          import json
          rows=json.load(open("tree.json",encoding="utf-8"))
          if not isinstance(rows,list):
              print(json.dumps(rows,ensure_ascii=False)[:3000])
              raise SystemExit
          roots=[r for r in rows if int(r.get("pi") or 0)==0]
          children={}
          for r in rows:
              children.setdefault(int(r.get("pi") or 0),[]).append(r)
          out=[]
          for r in roots[:40]:
              out.append({
                "i":r.get("i"),"d":r.get("d"),
                "children":[{"i":c.get("i"),"d":c.get("d")} for c in children.get(int(r.get("i") or 0),[])[:12]]
              })
          print(json.dumps({"count":len(rows),"roots":out},ensure_ascii=False))
          PY

      - name: Probe oil-filter OEM and supplier handoff
        shell: bash
        env:
          FAPI_API_KEY: ${{ secrets.FAPI_API_KEY }}
        run: |
          set -Eeuo pipefail
          echo "::add-mask:${FAPI_API_KEY}"
          curl -sS \
            -H "Authorization: Bearer ${FAPI_API_KEY}" \
            -H "Accept: application/json" \
            "https://fapi.iisis.ru/fapi/v2/catalogList/dt/productListOEM?modi=33778&nodei=100259&strict=1" > oem.json
          echo "OIL FILTER OEM:"
          python3 - <<'PY'
          import json
          rows=json.load(open("oem.json",encoding="utf-8"))
          print(json.dumps((rows if isinstance(rows,list) else [])[:8],ensure_ascii=False))
          if not isinstance(rows,list) or not rows:
              raise SystemExit("No OEM rows")
          open("first-oem.txt","w").write(str(rows[0].get("n") or ""))
          PY
          ARTICLE="$(cat first-oem.txt)"
          echo "SUPPLIER BRANDS FOR OEM:"
          curl -fsS "https://api.201.51.28.68.sslip.io/api/catalog/brands?number=${ARTICLE}" > brands.json
          python3 - <<'PY'
          import json
          d=json.load(open("brands.json",encoding="utf-8"))
          rows=d.get("brands") or []
          print(json.dumps({"count":len(rows),"sample":rows[:5]},ensure_ascii=False))
          if not rows:
              raise SystemExit("Supplier returned no brands")
          PY
