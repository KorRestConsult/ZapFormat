<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ZapFormat — Управление</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#17253b;background:#f3f5f9}*{box-sizing:border-box}body{margin:0}aside{position:fixed;inset:0 auto 0 0;width:235px;background:#111d31;color:white;padding:27px 17px}aside h1{font-size:25px;margin:0 12px}aside small{display:block;margin:7px 12px 32px;color:#98acc8}nav button{display:block;width:100%;padding:15px;text-align:left;border:0;background:transparent;color:#c8d3e4;border-radius:9px;cursor:pointer;font-size:15px}nav button.active,nav button:hover{background:#2c405e;color:white}main{margin-left:235px;padding:36px;max-width:1600px}header{display:flex;align-items:center;justify-content:space-between;gap:15px}h2{margin:0;font-size:27px}p{color:#718096}.status{background:#fff0d8;color:#855a0b;border-radius:20px;padding:10px 14px;font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:28px 0}.card,.panel{background:white;border:1px solid #e4e9f0;border-radius:16px;padding:24px}.card span{color:#7a8899;font-size:14px}.card strong{display:block;font-size:28px;margin-top:15px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}h3{margin:0 0 16px}.panel button{border:0;border-radius:9px;background:#eef2f8;padding:13px 16px;cursor:pointer;margin:5px}table{width:100%;border-collapse:collapse}th,td{padding:15px 8px;border-bottom:1px solid #e8ecf3;text-align:left}th{font-size:13px;color:#8290a2}.empty{padding:25px;text-align:center;color:#7b8797}.notice{margin-top:18px;color:#718096;font-size:13px}.hidden{display:none}input[type=range]{width:100%}label{display:block;margin:18px 0}a{color:#315eaa}@media(max-width:850px){aside{position:static;width:auto;padding:15px}aside small{margin-bottom:8px}nav{display:flex;overflow:auto}nav button{white-space:nowrap}main{margin:0;padding:20px}.cards,.grid{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}</style></head>
<body><aside><h1>ZapFormat</h1><small>Управление бизнесом</small><nav id="nav"><button class="active" data-page="home">▦ Главная</button><button data-page="orders">▤ Заказы</button><button data-page="pricing">％ Наценки</button><button data-page="clients">♙ Клиенты</button><button data-page="logistics">▣ Склад и доставка</button><button data-page="analytics">▥ Аналитика</button></nav></aside><main><header><div><h2 id="heading">Обзор бизнеса</h2><p>Отдельная административная панель</p></div><span id="status" class="status">Требуется авторизация владельца</span></header><div id="body"></div><p class="notice">Административные данные не загружаются без подтверждённой сервером роли владельца. Наценки не изменяют реальные цены до подключения защищённого API.</p></main>
<script>
"use strict";
const API="https://api.168.113.211.246.sslip.io";
const pages={home:"Обзор бизнеса",orders:"Заказы",pricing:"Наценки",clients:"Клиенты",logistics:"Склад и доставка",analytics:"Аналитика"};
const root=document.getElementById("body");
function render(page){document.getElementById("heading").textContent=pages[page];document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));if(page==="home"){root.innerHTML='<div class="cards">'+["Выручка","Закупка","Валовая прибыль","Активные заказы"].map(x=>'<div class="card"><span>'+x+'</span><strong>—</strong></div>').join("")+'</div><div class="grid"><div class="panel"><h3>Последние заказы</h3><div class="empty">Для просмотра заказов необходим вход владельца.</div></div><div class="panel"><h3>Быстрые действия</h3><button data-go="orders">Открыть заказы</button><button data-go="pricing">Настроить наценки</button><button data-go="logistics">Склад и доставка</button></div></div>'}else if(page==="pricing"){root.innerHTML='<section class="panel"><h3>Наценки по закупочной цене</h3><p>Предварительная настройка. Значения не сохраняются на сервере и не влияют на магазин.</p>'+[[0,500,15],[500,2000,15],[2000,10000,15],[10000,"∞",15]].map(([a,b,v])=>'<label>От '+a+' до '+b+' ₽ — <b>'+v+'%</b><input type="range" min="0" max="60" value="'+v+'" oninput="this.previousElementSibling.textContent=this.value+\'%\'"></label>').join("")+'<p>Сохранение появится после подключения защищённого API.</p></section>'}else{root.innerHTML='<section class="panel"><h3>'+pages[page]+'</h3><div class="empty">Данные доступны только после входа владельца и подключения серверного API.</div></section>'}root.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>render(b.dataset.go)));}
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest("[data-page]");if(b)render(b.dataset.page)});render("home");
fetch(API+"/api/health",{credentials:"omit",signal:AbortSignal.timeout(7000)}).then(r=>{if(!r.ok)throw Error();document.getElementById("status").textContent="Сервер доступен · вход владельца требуется"}).catch(()=>{document.getElementById("status").textContent="Связь с сервером не подтверждена"});
</script></body></html>
